<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>逐年灾害堆叠面积图</title>

<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { padding:24px; background:#F5F7FA; font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif; color:#2F3540; }
.card { background:#fff; border:1px solid #E6EBF0; border-radius:12px; box-shadow:0 4px 16px rgba(73,122,183,.10); padding:16px; }
h3 { font-size:17px; font-weight:600; margin:0 0 6px 4px; border-left:4px solid #497AB7; padding-left:10px; }
.sub { font-size:12px; color:#7C8798; margin:0 0 12px 14px; }
#chart { width:100%; height:580px; }
</style>
<style>html,body{height:100%!important;margin:0!important;padding:0!important;background:#fff!important;overflow:hidden}#chart{width:100%!important;min-height:300px}.card{box-shadow:none!important;border:none!important;margin:0!important;padding:0!important}#chart{height:calc(100% - 4px)!important}</style></head>
<body>


<div class="card" id="chart"></div>

const typeCn = {"Earthquake": "地震", "Flood": "洪水", "Cyclone/Typhoon/Hurricane": "风暴", "Wildfire": "野火", "Landslide": "滑坡", "Drought": "干旱", "Tsunami": "海啸", "Volcanic Eruption": "火山喷发", "Tornado": "龙卷风", "Avalanche": "雪崩"};
const chart = echarts.init(document.getElementById('chart'));
const seriesList = Object.keys(areaBundle).filter(function (k) { return k !== "years"; }).map(function (k) {
  return {
    name: typeCn[k] || k, type: 'line', stack: 'total',
    lineStyle: { width: 1.6, color: colorMap[k] },
    itemStyle: { color: colorMap[k] },
    areaStyle: { opacity: 0.9 },
    emphasis: { focus: 'series' },
    data: areaBundle[k]
  };
});
chart.setOption({
  tooltip: { trigger: 'axis', axisPointer: { type: 'line' } },
  legend: { bottom: 6, left: 'center', width: '88%', itemWidth: 12, itemHeight: 12, textStyle: { color: '#2F3540', fontSize: 12 } },
  grid: { left: 56, right: 28, top: 60, bottom: 76 },
  xAxis: { type: 'category', data: areaBundle.years, boundaryGap: false,
    axisLabel: { color: '#5B6473', fontSize: 12 }, axisLine: { lineStyle: { color: '#D8DDE6' } }, axisTick: { show: false } },
  yAxis: { type: 'value', name: '事件数', nameTextStyle: { color: '#5B6473' },
    axisLabel: { color: '#5B6473' }, splitLine: { lineStyle: { color: '#EFF3F7' } }, axisLine: { show: false } },
  series: seriesList
});
window.addEventListener('resize', function () { chart.resize(); });
</script>
<style></style><script>
(function(){
  var dom = document.getElementById('chart'); if(!dom) return;
  var inst = null;
  function boot(){ inst = echarts.getInstanceByDom(dom); if(!inst){ setTimeout(boot,150); return; }
    inst.on('click', function(p){ var f = (function(p){ var ZH={"Earthquake": "地震", "Flood": "洪水", "Cyclone/Typhoon/Hurricane": "台风/飓风", "Wildfire": "野火", "Landslide": "滑坡", "Drought": "干旱", "Volcanic Eruption": "火山喷发", "Tsunami": "海啸", "Tornado": "龙卷风", "Avalanche": "雪崩"}; return {source:"area", disaster: ZH[p.seriesName]}; })(p); if(f) window.parent.postMessage({type:'filter', filter:f},'*'); });
  }
  boot();
  window.addEventListener('message', function(e){ var d = e.data || {};
    if(d.type !== 'applyFilter') return; (function(inst,f){ if(!inst) return; var ZH={"Earthquake": "地震", "Flood": "洪水", "Cyclone/Typhoon/Hurricane": "台风/飓风", "Wildfire": "野火", "Landslide": "滑坡", "Drought": "干旱", "Volcanic Eruption": "火山喷发", "Tsunami": "海啸", "Tornado": "龙卷风", "Avalanche": "雪崩"}; var EN={"地震": "Earthquake", "洪水": "Flood", "台风/飓风": "Cyclone/Typhoon/Hurricane", "野火": "Wildfire", "滑坡": "Landslide", "干旱": "Drought", "火山喷发": "Volcanic Eruption", "海啸": "Tsunami", "龙卷风": "Tornado", "雪崩": "Avalanche"}; inst.dispatchAction({type:"legendAllSelect"}); if(!f||!f.disaster) return; var keep=EN[f.disaster]; Object.keys(ZH).forEach(function(k){ if(k!==keep) inst.dispatchAction({type:"legendUnSelect", name:k}); }); })(inst, d.filter); });
})();
</script></body>
