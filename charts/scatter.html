<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>散点图: 46国事件量x死亡人数双对数</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Helvetica Neue", sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            min-height: 100vh;
            padding: 30px;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(73, 122, 183, 0.15);
            padding: 30px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h1 {
            font-size: 24px;
            color: #2c3e50;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .header p {
            color: #7f8c8d;
            font-size: 14px;
        }
        #chart { width: 100%; height: 580px; }
        .stats-bar {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        .stat-item {
            background: linear-gradient(135deg, #BDE2ED, #7EB6D5);
            color: #2c3e50;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
        }
        .stat-item b { font-size: 16px; color: #1a365d; }
        .note {
            text-align: center;
            color: #95a5a6;
            font-size: 12px;
            margin-top: 10px;
        }
    </style>

<body>
    <div class="container">

        var regions = ['Asia', 'Africa', 'North America', 'South America', 'Europe', 'Oceania', 'Asia/Europe', 'Europe/Asia'];
        var series = [];

        regions.forEach(function(region) {
            var points = scatterData.filter(function(d) { return d.region === region; });
            if (points.length === 0) return;
            series.push({
                name: region,
                type: 'scatter',
                data: points.map(function(d) {
                    return {
                        name: d.name,
                        value: d.value,
                        symbolSize: 15 + d.severity * 30,
                        itemStyle: {
                            color: regionColors[region],
                            opacity: 0.82,
                            borderColor: '#fff',
                            borderWidth: 1.5
                        }
                    };
                })
            });
        });

        series.push({
            name: '拟合线',
            type: 'line',
            data: fitLine,
            smooth: true,
            symbol: 'none',
            lineStyle: {
                color: '#F27144',
                width: 2.5,
                type: 'solid'
            },
            tooltip: { show: false },
            legendHoverLink: false
        });

        var chart = echarts.init(document.getElementById('chart'));

        var option = {
            tooltip: {
                trigger: 'item',
                backgroundColor: 'rgba(44, 62, 80, 0.95)',
                borderColor: 'transparent',
                textStyle: { color: '#fff', fontSize: 13 },
                formatter: function(params) {
                    if (params.seriesName === '拟合线') return '';
                    return '<div style="font-weight:600;margin-bottom:6px;">' + params.name + '</div>' +
                           '<div>区域: ' + params.data.region + '</div>' +
                           '<div>事件量: <b>' + params.data.value[0] + '</b> 起</div>' +
                           '<div>死亡数: <b>' + params.data.value[1].toLocaleString() + '</b> 人</div>';
                }
            },
            legend: {
                data: regions.filter(function(r) { 
                    return scatterData.some(function(d) { return d.region === r; });
                }),
                top: 1,
                textStyle: { color: '#2c3e50' },
                itemWidth: 14,
                itemHeight: 14
            },
            grid: {
                left: '9%',
                right: '6%',
                top: '16%',
                bottom: '13%',
                containLabel: true
            },
            xAxis: {
                type: 'log',
                name: '事件量 (起)',
                nameLocation: 'middle',
                nameGap: 40,
                nameTextStyle: { color: '#2c3e50', fontSize: 11, fontWeight: 400 },
                min: 5,
                max: 1000,
                logBase: 10,
                axisLabel: {
                    color: '#7f8c8d',
                    formatter: function(v) { return v; }
                },
                axisLine: { lineStyle: { color: '#bdc3c7' } },
                splitLine: { lineStyle: { color: '#ecf0f1', type: 'dashed' } }
            },
            yAxis: {
                type: 'log',
                name: '死亡人数',
                nameLocation: 'middle',
                nameGap: 50,
                nameTextStyle: { color: '#2c3e50', fontSize: 11, fontWeight: 400 },
                min: 100,
                max: 200000,
                logBase: 10,
                axisLabel: {
                    color: '#7f8c8d',
                    formatter: function(v) { return v; }
                },
                axisLine: { lineStyle: { color: '#bdc3c7' } },
                splitLine: { lineStyle: { color: '#ecf0f1', type: 'dashed' } }

            series: series

        chart.setOption(option);
        window.addEventListener('resize', function() { chart.resize(); });
    </script>
<style></style><script>
(function(){
  var dom = document.getElementById('chart'); if(!dom) return;
  var inst = null;
  function boot(){ inst = echarts.getInstanceByDom(dom); if(!inst){ setTimeout(boot,150); return; }
    inst.on('click', function(p){ var f = (function(p){ return null; })(p); if(f) window.parent.postMessage({type:'filter', filter:f},'*'); });
  }
  boot();
  window.addEventListener('message', function(e){ var d = e.data || {};
    if(d.type !== 'applyFilter') return; (function(inst,f){ if(inst) inst.dispatchAction({type:"downplay"}); })(inst, d.filter); });
})();
</script></body>
