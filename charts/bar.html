  const top = COUNTRY_DATA.slice().sort(function (a, b) { return b[key] - a[key]; }).slice(0, 15);

    grid: { left: 112, right: 104, top: 20, bottom: 36 },

    xAxis: { type: 'value', max: function (v) { return Math.ceil(v.max * 1.15 / 50) * 50; },

<style></style><script>
(function(){
  var dom = document.getElementById('chart'); if(!dom) return;
  var inst = null;
  function boot(){ inst = echarts.getInstanceByDom(dom); if(!inst){ setTimeout(boot,150); return; }
    inst.on('click', function(p){ var f = (function(p){ return {source:"bar", country: p.name}; })(p); if(f) window.parent.postMessage({type:'filter', filter:f},'*'); });
  }
  boot();
  window.addEventListener('message', function(e){ var d = e.data || {};
    if(d.type !== 'applyFilter') return; (function(inst,f){ if(!inst) return; inst.dispatchAction({type:"downplay"}); if(!f||!f.country) return; var y = inst.getOption().yAxis[0].data; var idx = y.indexOf(f.country); if(idx>=0) inst.dispatchAction({type:"highlight", seriesIndex:0, dataIndex:idx}); })(inst, d.filter); });
})();
